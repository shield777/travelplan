# 매일 아침 항공권 가격·특가·카드 할인 확인 → data/ 에 저장 → 휴대폰 알림(ntfy)
# 설정 방법: docs/FLIGHT_SETUP.md
name: 항공권 매일 확인

on:
  schedule:
    - cron: '23 22 * * *'   # 매일 한국시간 07:23 (UTC 22:23)
  workflow_dispatch:         # 앱의 "지금 갱신" 버튼이나 Actions 화면의 Run workflow로 바로 실행
    inputs:
      mode:
        description: 'check = 평소 점검, test-notify = 휴대폰 알림 테스트만'
        type: choice
        options: [check, test-notify]
        default: check

permissions:
  contents: write

concurrency:
  group: flight-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 가격·프로모션 확인
        run: node scripts/flight-check.js ${{ inputs.mode == 'test-notify' && '--test-notify' || '' }}
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/flights.html
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/flight-results.json data/promos.json
          if git diff --cached --quiet; then echo "바뀐 내용 없음"; exit 0; fi
          git commit -m "항공권 가격·프로모션 갱신 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1

